<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bird Sightings around USC</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f2;
    color: #222;
  }

  main {
    max-width: 1450px;
    margin: 0 auto;
    padding: 35px 30px 45px;
  }

  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-size: 36px;
    color: #173d24;
  }

  .accent {
    width: 55px;
    height: 3px;
    background: #496b24;
    margin: 0 auto 20px;
    border-radius: 2px;
  }

  .intro {
    max-width: 950px;
    margin: 0 auto 30px;
    text-align: center;
    line-height: 1.6;
    font-size: 17px;
    color: #444;
  }

  iframe {
    display: block;
    width: 100%;
    height: 760px;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    background: white;
  }
</style>
  
</head>

<body>

<main>
  <h1>Bird Sightings around USC</h1>

  <div class="accent"></div>

  <p class="intro">
    This interactive web map shows bird observations from iNaturalist
    around USC and nearby neighborhoods. Users can filter observations
    by species and date and click on the map to view more information
    about individual observations.
  </p>
  
  <iframe
    src="https://experience.arcgis.com/experience/fc32d544f04942d4a739f2782c54fae1"
    title="Bird Sightings around USC"
    allowfullscreen>
  </iframe>
</main>

</body>

</html>
